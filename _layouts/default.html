<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

    
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="HackHubAfrica home">
        <span class="brand-mark" aria-hidden="true">HH</span>
        <span>HACKHUB<span class="brand-light">AFRICA</span></span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#handbook">Documentation</a>
        <a href="{{ '/docs/' | relative_url }}">Knowledge archive <span aria-hidden="true">↗</span></a>
        <a href="https://github.com/hackhubafrica" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">HH</span>
        <span>HACKHUB<span class="brand-light">AFRICA</span></span>
      </a>
      <span>Make things. Share what works.</span>
      <nav class="footer-socials" aria-label="Social links">
        {% for social in site.social_links %}
          <a href="{{ social.url | escape }}" target="_blank" rel="me noreferrer">{{ social.label | escape }} <span aria-hidden="true">↗</span></a>
        {% endfor %}
      </nav>
    </footer>
        <script>
            document.querySelectorAll("pre > code").forEach((codeBlock) => {
            const button = document.createElement("button");
            button.className = "copy-code-button";
            button.type = "button";
            button.innerText = "Copy";

            const pre = codeBlock.parentNode;
            pre.style.position = "relative";
            pre.appendChild(button);

            button.addEventListener("click", () => {
                navigator.clipboard.writeText(codeBlock.innerText).then(() => {
                button.innerText = "Copied!";
                setTimeout(() => {
                    button.innerText = "Copy";
                }, 2000);
                });
            });
            });
        </script>

        <style>
        .copy-code-button {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #334155;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.2s;
        }
        .copy-code-button:hover {
        background: #475569;
        }
        </style>
  </body>
</html>
